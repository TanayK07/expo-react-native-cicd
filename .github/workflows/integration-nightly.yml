name: Integration Tests (Nightly)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  # Generate the matrix dynamically from the manifest
  setup-matrix:
    name: Setup Matrix
    runs-on: ubuntu-latest
    outputs:
      chunk0-matrix: ${{ steps.generate.outputs.chunk0-matrix }}
      chunk0-length: ${{ steps.generate.outputs.chunk0-length }}
      chunk1-matrix: ${{ steps.generate.outputs.chunk1-matrix }}
      chunk1-length: ${{ steps.generate.outputs.chunk1-length }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate chunk matrices
        id: generate
        run: |
          MANIFEST="integration-tests/configs/nightly-matrix-manifest.json"
          CHUNK_COUNT=$(node -e "console.log(require('./$MANIFEST').chunkCount)")
          echo "Total chunks: $CHUNK_COUNT"

          for i in $(seq 0 $((CHUNK_COUNT - 1))); do
            CHUNK_FILE=$(node -e "console.log(require('./$MANIFEST').chunks[$i].file)")
            LENGTH=$(node -e "console.log(require('./integration-tests/configs/$CHUNK_FILE').length)")
            INDICES=$(node -e "console.log(JSON.stringify([...Array($LENGTH).keys()]))")
            echo "chunk${i}-matrix={\"index\":$INDICES}" >> $GITHUB_OUTPUT
            echo "chunk${i}-length=$LENGTH" >> $GITHUB_OUTPUT
            echo "Chunk $i: $LENGTH entries from $CHUNK_FILE"
          done

  # Chunk 0: indices 0-255
  fixture-tests-chunk0:
    name: "Fixture C0 #${{ matrix.index }}"
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.setup-matrix.outputs.chunk0-matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install webapp dependencies
        working-directory: webapp
        run: yarn install --frozen-lockfile

      - name: Install integration-tests dependencies
        working-directory: integration-tests
        run: npm ci

      - name: Determine fixture app
        id: fixture
        working-directory: integration-tests
        run: |
          FIXTURE=$(node -e "
            const m = require('./configs/nightly-matrix-chunk0.json');
            console.log(m[${{ matrix.index }}].fixture);
          ")
          echo "dir=$FIXTURE" >> $GITHUB_OUTPUT
          echo "Fixture: $FIXTURE"

      - name: Install fixture app dependencies
        working-directory: integration-tests/fixtures/${{ steps.fixture.outputs.dir }}
        run: |
          if [ "${{ steps.fixture.outputs.dir }}" = "yarn-app" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ steps.fixture.outputs.dir }}" = "pnpm-app" ]; then
            npm install -g pnpm
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Run integration test
        working-directory: integration-tests
        run: |
          npx ts-node scripts/run-single.ts \
            --matrix-file configs/nightly-matrix-chunk0.json \
            --config-index ${{ matrix.index }} \
            --fixture-dir fixtures/${{ steps.fixture.outputs.dir }} \
            --skip-build \
            --continue-on-error \
            --verbose

  # Chunk 1: indices 256-378
  fixture-tests-chunk1:
    name: "Fixture C1 #${{ matrix.index }}"
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.setup-matrix.outputs.chunk1-matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install webapp dependencies
        working-directory: webapp
        run: yarn install --frozen-lockfile

      - name: Install integration-tests dependencies
        working-directory: integration-tests
        run: npm ci

      - name: Determine fixture app
        id: fixture
        working-directory: integration-tests
        run: |
          FIXTURE=$(node -e "
            const m = require('./configs/nightly-matrix-chunk1.json');
            console.log(m[${{ matrix.index }}].fixture);
          ")
          echo "dir=$FIXTURE" >> $GITHUB_OUTPUT
          echo "Fixture: $FIXTURE"

      - name: Install fixture app dependencies
        working-directory: integration-tests/fixtures/${{ steps.fixture.outputs.dir }}
        run: |
          if [ "${{ steps.fixture.outputs.dir }}" = "yarn-app" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ steps.fixture.outputs.dir }}" = "pnpm-app" ]; then
            npm install -g pnpm
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Run integration test
        working-directory: integration-tests
        run: |
          npx ts-node scripts/run-single.ts \
            --matrix-file configs/nightly-matrix-chunk1.json \
            --config-index ${{ matrix.index }} \
            --fixture-dir fixtures/${{ steps.fixture.outputs.dir }} \
            --skip-build \
            --continue-on-error \
            --verbose

  # Community repo tests
  community-tests:
    name: "Community: ${{ matrix.repo }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { repo: "expo/examples", index: 0 }
          - { repo: "callstack/react-native-paper", index: 1 }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install webapp dependencies
        working-directory: webapp
        run: yarn install --frozen-lockfile

      - name: Install integration-tests dependencies
        working-directory: integration-tests
        run: npm ci

      - name: Run community test — ${{ matrix.repo }}
        working-directory: integration-tests
        run: |
          npx ts-node scripts/community-runner.ts \
            --repo-index ${{ matrix.index }} \
            --verbose

  # Summary report
  report:
    name: Summary Report
    runs-on: ubuntu-latest
    needs: [fixture-tests-chunk0, fixture-tests-chunk1, community-tests]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Fixture Tests (Chunk 0) | ${{ needs.fixture-tests-chunk0.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fixture Tests (Chunk 1) | ${{ needs.fixture-tests-chunk1.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Community Tests | ${{ needs.community-tests.result }} |" >> $GITHUB_STEP_SUMMARY
